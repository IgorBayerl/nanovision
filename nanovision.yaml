# ------------------------------------------------------------------
#  nanovision Configuration for the Self-Coverage Report
# ------------------------------------------------------------------
# This file defines the default settings for generating nanovision's own coverage report.
# CLI flags provided by the python script will override the settings in this file.
#
# `nanovision config docs` prints every key with its documentation.
# `nanovision config check` validates this file and the ones in sub-folders.

# The coverage reports to merge. `source` is the folder the paths inside the
# report are relative to (default: the project root). `name` is the label in
# the report selector (default: the file name).
#
# The three demo projects list their own reports. See the nanovision.yaml in
# demo_projects/cpp, demo_projects/csharp and demo_projects/go.
reports:
  - path: "reports/nanovision_self_coverage/coverage-unit.out"
    name: "unit tests"
  - path: "reports/nanovision_self_coverage/coverage-integration.out"
    name: "e2e tests"

# The directory where the final self-coverage report will be saved.
output_dir: "reports/nanovision_self_coverage_full"

# The types of reports to generate.
report_types:
  - "Html"          # has a Changes tab when the run has a diff or a base run
  # - "HtmlUnified" # the same report as one file
  - "TextSummary"
  - "Lcov"
  - "RawJson"

# The title for the generated HTML report.
title: "nanovision Self-Coverage (Full Merged)"

# Logging verbosity for the self-coverage run.
verbosity: "Verbose"

# glob patterns to exclude from the report
ignore_files:
  - "tree-sitter/**"
  - "**/*_test.go"
  - "scripts/**"
  - "vendor/**"
  - "reports/**"   # generated output; also keeps the config search out of it
  - "internal/analyzer/analyzer.go"
  - "internal/filesystem/filesystem.go"
  - "internal/reporter/context.go"
  - "internal/testutil/**"

# The metrics to show, in column order. `nanovision -list-metrics` lists them.
#
# `warning` is the range "min..max" that counts as warning. For a coverage
# metric, below the range is danger and above it is safe. For a
# lower-is-better metric such as complexity, it is the reverse. A metric
# without a range has no status indicator.
metrics:
  files:        # per file and folder
    - name: statement_coverage
      warning: "60..75"
    - name: methods_hit
    - name: methods_fully_covered
    - name: patch_methods_hit
      warning: "80..90"
    - name: patch_statement_coverage
      warning: "70..80"
    - name: statement_methods_hit
    - name: statement_methods_fully_covered
    - name: patch_statement_methods_hit
    - name: max_complexity
    # - name: line_coverage
    # - name: patch_line_coverage

  methods:      # per method, on the file page
    - name: statement_coverage
    - name: complexity
    - name: patch_statement_coverage
    - name: crap_score
    # - name: line_coverage
    # - name: patch_line_coverage

# A folder can have its own warning ranges, ignored files and reports.
# Put a nanovision.yaml inside the folder. It applies to that folder and
# everything below it. Every other key is valid only in this root file.
#
# This repository has four:
#   cmd/nanovision.yaml              a lower range for the command line code
#   internal/store/nanovision.yaml   stricter ranges for the run store
#   demo_projects/*/nanovision.yaml  each demo lists its own report
#
# "nanovision config check" lists every config file it finds.
# "nanovision config show internal/store" prints what applies to a folder.

# filters applied on first open, unless the URL already carries a query string.
# join them with '&':
#   risk=danger    only danger rows
#   q=src/         path search
#   cols=statement_coverage,max_cyclomatic_complexity   visible columns
# default_filters: "risk=danger&q=src/"

diff:
  file: "my_changes.diff" # also set with -diff
  strip: "auto"           # "auto", or 0-6 leading path components to strip
  # only_changed: true    # the HTML report holds only the changed files. also set with -only-changed

review:
  gate:                                # thresholds for the pass/fail verdict
    patch_statement_coverage: 80       # min % coverage of changed statements
    max_changed_method_complexity: 15  # max CC of any added or modified method
  # when to exit non-zero: "error", "warning" or "never". also set with -fail-on
  fail_on: "never"

ignore_cache: true
