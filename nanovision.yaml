# ------------------------------------------------------------------
#  nanovision Configuration for the Self-Coverage Report
# ------------------------------------------------------------------
# This file defines the default settings for generating nanovision's own
# coverage report. CLI flags provided by the python script will override
# the settings in this file.

# A list of coverage report files to parse for the merged report.
reports:
  - "reports/nanovision_self_coverage/coverage-unit.out"
  - "reports/nanovision_self_coverage/coverage-integration.out"
  - "demo_projects/cpp/report/gcov/branch-probabilities/*.gcov"
  - "demo_projects/csharp/report/cobertura/cobertura.xml"
  - "demo_projects/go/report/gocover/coverage.out"

# A list of source code directories. The order must match the `reports` list.
source_dirs:
  - "."
  - "."
  - "demo_projects/cpp/project"
  - "demo_projects/csharp/project"
  - "demo_projects/go/project"

# The directory where the final self-coverage report will be saved.
output_dir: "reports/nanovision_self_coverage_full"

# The types of reports to generate.
report_types:
  - "HtmlUnified"
  - "TextSummary"
  - "Lcov"
  - "RawJson"

# The title for the generated HTML report.
title: "nanovision Self-Coverage (Full Merged)"

# Logging verbosity for the self-coverage run.
verbosity: "Verbose"

# A list of glob patterns for files and directories to exclude from the report.
# This is crucial for ignoring generated files and the vendored tree-sitter grammars,
# which are not part of the core tool's logic.
ignore_files:
  - "tree-sitter/**"
  - "**/*_test.go"
  - "scripts/**"
  - "vendor/**"
  - "internal/analyzer/analyzer.go"
  - "internal/filesystem/filesystem.go"
  - "internal/reporter/context.go"
  - "internal/testutil/**"


# Risk Status Thresholds
# Defines the percentage ranges for 'warning' status.
# - Percentages BELOW the minimum are marked as 'danger'.
# - Percentages WITHIN the range (inclusive) are 'warning'.
# - Percentages ABOVE the maximum are 'safe'.
#
# Format: "min..max" (e.g., "60..75")
# Metric keys must be in snake_case.
# If a metric is not listed here, it will not have a status indicator.
#
status_bands:
  # --- File & Directory Metrics ---
  # line_coverage: "60..75"
  statement_coverage: "60..75"
  branch_coverage: "50..70"
  # methods_hit: "60..80"
  methods_fully_covered: "40..60"
  # patch_line_coverage: "80..90"
  patch_statement_coverage: "80..90"
  patch_methods_hit: "80..90"
  # statement_methods_hit: "60..80"
  # statement_methods_fully_covered: "40..60"
  # patch_statement_methods_hit: "80..90"
  # max_cyclomatic_complexity: "10..20"

  # --- Method & Function Metrics ---
  # method_line_coverage: "60..75"
  # method_statement_coverage: "60..75"
  # method_patch_line_coverage: "80..90"
  # method_patch_statement_coverage: "80..90"
  # cyclomatic_complexity: "10..20"

# Optional settings for patch coverage analysis.
diff:
  file: "my_changes.diff" # Path to the .diff file (can also be set via -diff flag)
  strip: "auto"           # "auto" or an integer (0-6) to strip leading path components

# Explicit Display List for UI Reports
# Specifies which metrics should be included in generated reports.
# See internal/config/config.go for the full list of supported metrics.
file_metrics:
  # - "line_coverage"
  - "statement_coverage"
  - "branch_coverage"
  - "methods_hit"
  - "methods_fully_covered"
  # - "patch_line_coverage"
  - "patch_methods_hit"
  - "patch_statement_coverage"
  - "statement_methods_hit"
  - "statement_methods_fully_covered"
  - "patch_statement_methods_hit"
  - "max_cyclomatic_complexity"

method_metrics:
  # - "method_line_coverage"
  - "method_statement_coverage"
  - "cyclomatic_complexity"
  - "method_branch_coverage"
  # - "method_patch_line_coverage"
  - "method_patch_statement_coverage"
  - "method_crap_score"
  - "method_patch_crap_score"
  - "method_exposed_risk"
  - "method_defect_probability"

ignore_cache: true