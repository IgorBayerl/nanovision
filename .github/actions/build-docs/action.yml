name: Build Docs
description: Build Astro site and upload as artifact
inputs:
  node-version:
    description: Node.js version
    default: '20'
  retention-days:
    description: Artifact retention (days) for non-PR runs
    default: '1'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: docs/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: docs
      run: npm ci

    - name: Build Astro
      shell: bash
      working-directory: docs
      run: npm run build

    - name: Repack docs to out/docs
      shell: bash
      run: |
        rm -rf out/docs
        mkdir -p out/docs
        # Astro builds to dist by default
        cp -r docs/dist/* out/docs/
        
    - name: Upload docs bundle
      if: ${{ github.event_name != 'pull_request' }}
      uses: actions/upload-artifact@v4
      with:
        name: site-docs
        path: out/docs
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error
