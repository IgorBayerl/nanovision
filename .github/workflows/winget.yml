name: Publish to Winget

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.1.1)'
        required: false

jobs:
  winget:
    name: Publish to Winget
    runs-on: ubuntu-latest
    steps:
      - name: Sync winget-pkgs fork
        run: |
          gh repo sync IgorBayerl/winget-pkgs -b master
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
      - name: Submit to Winget
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: IgorBayerl.nanovision
          token: ${{ secrets.WINGET_TOKEN }}
          installers-regex: '.(exe|msi|msix|appx|zip)(bundle){0,1}$'
          release-tag: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
